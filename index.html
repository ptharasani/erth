<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركز إرث الرعاية الطبية | علاج طبيعي وإعادة تأهيل في جدة</title>
<meta name="description" content="مركز إرث الرعاية الطبية: مركز متخصص في العلاج الطبيعي وإعادة التأهيل في جدة. استكشف الجسم ثلاثي الأبعاد، تعرّف على الأخصائيين واحجز موعدك مباشرة.">
<meta name="theme-color" content="#eef1f8">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="canonical" href="https://ptharasani.github.io/erth/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_SA">
<meta property="og:site_name" content="مركز إرث الرعاية الطبية">
<meta property="og:title" content="مركز إرث الرعاية الطبية | علاج طبيعي وإعادة تأهيل في جدة">
<meta property="og:description" content="استكشف الجسم ثلاثي الأبعاد، تعرّف على الأخصائيين واحجز موعدك مباشرة.">
<meta property="og:url" content="https://ptharasani.github.io/erth/">
<meta property="og:image" content="https://ptharasani.github.io/erth/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl" aria-label="جولة ثلاثية الأبعاد في مركز إرث"></canvas>

<div id="loader">
  <img src="assets/img/erth-logo.webp" alt="مركز إرث الرعاية الطبية" width="180">
  <div class="bar"><i id="loadbar"></i></div>
  <p id="loadtxt">نجهّز لك الجولة...</p>
</div>

<header id="top">
  <a class="brand" href="#hero" aria-label="مركز إرث الرعاية الطبية">
    <img src="assets/img/erth-mark.webp" alt="">
    <span><b>مركز إرث الرعاية الطبية</b><small>Erth Medicare Center</small></span>
  </a>
  <div class="top-actions">
    <button id="bookBtn" class="btn primary">احجز الآن</button>
    <button id="menuBtn" class="btn ghost icon" aria-label="القائمة"><span></span><span></span><span></span></button>
  </div>
</header>

<nav id="menu" aria-hidden="true"><ol id="menuList"></ol></nav>

<section id="title" aria-live="polite">
  <p class="kicker" id="tKicker"></p>
  <h1 id="tTitle"></h1>
  <p class="sub" id="tSub"></p>
  <div class="t-actions" id="tActions"></div>
  <p id="hint"></p>
</section>

<div id="stationTools"></div>
<div id="hotspots"></div>
<div id="tip" class="glass" role="tooltip"></div>
<svg id="leader" aria-hidden="true"><path id="leaderPath"/><rect id="leaderDot" width="12" height="12"/></svg>

<aside id="panel" aria-hidden="true">
  <div class="panel-in glass">
    <button class="close" id="panelClose" aria-label="إغلاق">✕</button>
    <div id="panelBody"></div>
  </div>
</aside>

<nav id="rail" aria-label="أقسام الموقع"><ol id="dots"></ol></nav>

<footer id="dock">
  <div class="dots-row glass">
    <button id="prevBtn" class="arrow" aria-label="القسم السابق">›</button>
    <div id="counter"><span id="cName"></span><span class="cnum" dir="ltr"><b id="cNum">01</b><i id="cOf">/ 08</i></span></div>
    <button id="nextBtn" class="arrow" aria-label="القسم التالي">‹</button>
  </div>
</footer>

<div id="fxText" aria-hidden="true"><div class="wipe-num"><span id="wipeNum">01</span><i id="wipeOf">/ 08</i></div><b class="wipe-name" id="wipeName"></b></div>

<div id="modal" aria-hidden="true">
  <div class="modal-in glass" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="modalClose" aria-label="إغلاق">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<noscript><p style="padding:2rem;color:#1b1f4b">هذا الموقع يحتاج تفعيل جافاسكربت ليعرض الجولة ثلاثية الأبعاد.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
